async function remind(){const L=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!L||!S)return;try{await L.requestPermissions();const pd=await L.getPending();if(pd.notifications.length)await L.cancel(pd);const now=Date.now(),ls=[];let id=1;
